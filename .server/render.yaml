services:
  - type: web
    name: kwachawise-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://your-vercel-app.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
